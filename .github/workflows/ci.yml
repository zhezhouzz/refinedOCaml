name: CI

on:
  push:
  pull_request:

jobs:
  ocaml-5-3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.3.0
          dune-cache: true

      - name: Install Z3
        run: |
          sudo apt-get update
          sudo apt-get install --yes z3

      - name: Install locked dependencies
        run: opam install . --deps-only --with-test --locked --yes

      - name: Verify compiler boundary
        run: test "$(opam exec -- ocamlc -version)" = "5.3.0"

      - name: Build and test
        run: opam exec -- dune build @all @install @refined

      - name: Check formatting
        run: opam exec -- dune build @fmt

