name: CI

on:
  push:
  pull_request:

jobs:
  ocaml-5-3:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3.0"
          cache: true

      - name: Restore locked dependencies
        id: opam-deps-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            _opam
            ~/.opam/download-cache
          key: opam-deps-v1-${{ runner.os }}-${{ runner.arch }}-ocaml-5.3.0-${{ hashFiles('refined_ocaml.opam.locked') }}
          restore-keys: |
            opam-deps-v1-${{ runner.os }}-${{ runner.arch }}-ocaml-5.3.0-

      - name: Install Z3
        run: |
          sudo apt-get update
          sudo apt-get install --yes z3

      - name: Install locked dependencies
        run: opam install . --deps-only --with-test --locked --yes

      - name: Save locked dependencies
        if: steps.opam-deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            _opam
            ~/.opam/download-cache
          key: ${{ steps.opam-deps-cache.outputs.cache-primary-key }}

      - name: Verify compiler boundary
        run: test "$(opam exec -- ocamlc -version)" = "5.3.0"

      - name: Build and test
        run: opam exec -- dune build @all @install @refined

      - name: Property fuzz tests
        env:
          REFINED_FUZZ_CASES: 20000
          REFINED_FUZZ_SEED: 1592594470
        run: opam exec -- dune build @fuzz

      - name: Check formatting
        run: opam exec -- dune build @fmt
