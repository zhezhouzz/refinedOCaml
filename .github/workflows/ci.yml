name: CI

on:
  push:
  pull_request:

jobs:
  ocaml-5-5:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5.0"
          cache: true

      - name: Restore locked dependencies
        id: opam-deps-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            _opam
            ~/.opam/download-cache
          key: opam-deps-v1-${{ runner.os }}-${{ runner.arch }}-ocaml-5.5.0-${{ hashFiles('refined_ocaml.opam.locked') }}
          restore-keys: |
            opam-deps-v1-${{ runner.os }}-${{ runner.arch }}-ocaml-5.5.0-

      - name: Install pinned Z3
        run: |
          python3 -m venv "$RUNNER_TEMP/refined-z3"
          "$RUNNER_TEMP/refined-z3/bin/python" -m pip install --only-binary=:all: -r dev/z3-requirements.txt
          echo "$RUNNER_TEMP/refined-z3/bin" >> "$GITHUB_PATH"

      - name: Install locked dependencies
        run: opam install . --deps-only --with-test --locked --yes

      - name: Save locked dependencies
        if: steps.opam-deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            _opam
            ~/.opam/download-cache
          key: ${{ steps.opam-deps-cache.outputs.cache-primary-key }}

      - name: Verify compiler boundary
        run: |
          test "$(opam exec -- ocamlc -version)" = "5.5.0"
          opam exec -- z3 --version
          test "$(opam exec -- z3 --version)" = "Z3 version 4.16.0 - 64 bit"

      - name: Build and test
        env:
          REFINED_SOLVER_TIMEOUT_SECONDS: 60
        run: opam exec -- dune build @all @install @refined

      - name: Upload failed benchmark obligation
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-failure
          path: _build/default/benchmarks/benchmark-failure.smt2
          if-no-files-found: ignore

      - name: Property fuzz tests
        env:
          REFINED_FUZZ_CASES: 20000
          REFINED_FUZZ_SEED: 1592594470
        run: opam exec -- dune build @fuzz

      - name: Check formatting
        run: opam exec -- dune build @fmt
